<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qui anime ?</title>
  <meta name="description" content="Roue de la chance pour désigner qui anime la réunion.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Qui anime&nbsp;?</a>
    <nav aria-label="Navigation principale">
      <a href="#/" data-nav="teams">Équipes</a>
      <a href="#/trash" data-nav="trash">Corbeille</a>
    </nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <!-- Résultat du tirage. Fermer sans choisir revient à garder la personne. -->
  <dialog id="result" class="result" aria-labelledby="result-name">
    <form method="dialog">
      <p class="result-lead">C'est au tour de</p>
      <h2 id="result-name" class="result-name"></h2>
      <div class="result-actions">
        <button value="withdraw" class="btn btn-primary">Retirer de la roue</button>
        <button value="keep" class="btn">Garder dans la roue</button>
      </div>
      <p class="result-hint">Gardez la personne si elle est absente, puis relancez.</p>
    </form>
  </dialog>

  <!-- Boîte de dialogue générique : confirmation ou saisie. -->
  <dialog id="ask" class="ask" aria-labelledby="ask-title">
    <form method="dialog">
      <h2 id="ask-title"></h2>
      <p id="ask-text"></p>
      <label id="ask-field" class="field">
        <span id="ask-label"></span>
        <input id="ask-input" maxlength="50" autocomplete="off">
      </label>
      <div class="ask-actions">
        <button value="cancel" class="btn" formnovalidate>Annuler</button>
        <button value="ok" id="ask-ok" class="btn btn-primary"></button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
